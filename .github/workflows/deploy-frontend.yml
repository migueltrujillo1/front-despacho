name: Despliegue Frontend a EKS

on:
  push:
    branches:
      - main
      - ep3-eks
    paths:
      - "index.html"
      - "src/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "Dockerfile"
      - "nginx.conf"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}
  ECR_FRONTEND_REPOSITORY: ep3-frontend
  IMAGE_TAG: ${{ github.sha }}
  NAMESPACE: ep3

jobs:
  construir-subir-desplegar:
    name: Construir, subir y desplegar frontend
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Iniciar sesión en Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Construir y subir imagen del frontend
        run: |
          docker build -t $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_FRONTEND_REPOSITORY:$IMAGE_TAG .
          docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_FRONTEND_REPOSITORY:$IMAGE_TAG

      - name: Instalar kubectl
        uses: azure/setup-kubectl@v4

      - name: Configurar acceso al clúster EKS
        run: |
          aws eks update-kubeconfig --region $AWS_REGION --name $EKS_CLUSTER_NAME

      - name: Actualizar imagen del frontend en EKS
        run: |
          kubectl set image deployment/frontend \
            frontend=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_FRONTEND_REPOSITORY:$IMAGE_TAG \
            -n $NAMESPACE

      - name: Esperar despliegue correcto del frontend
        run: |
          kubectl rollout status deployment/frontend -n $NAMESPACE --timeout=600s

      - name: Mostrar estado final del frontend
        run: |
          kubectl get pods -n $NAMESPACE
          kubectl get svc frontend -n $NAMESPACE