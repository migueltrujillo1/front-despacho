name: Deploy Frontend

on:
  push:
    branches:
      - deploy

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir imagen Docker
        run: |
          docker build -t TU_USUARIO_DOCKERHUB/front-despacho:latest .

      - name: Publicar imagen en Docker Hub
        run: |
          docker push TU_USUARIO_DOCKERHUB/front-despacho:latest

      - name: Desplegar en EC2 Frontend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /opt/app/front-despacho
            git pull origin deploy
            docker compose down
            docker compose pull
            docker compose up -d
            docker image prune -f