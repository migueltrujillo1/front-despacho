name: Deploy Frontend

on:
  push:
    branches:
      - deploy

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir imagen Docker
        run: |
          docker build --no-cache -t migutrujillo/front-despacho:latest .

      - name: Publicar imagen en Docker Hub
        run: |
          docker push migutrujillo/front-despacho:latest

      - name: Desplegar en EC2 Frontend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo chown -R ec2-user:ec2-user /opt/app/front-despacho
            git config --global --add safe.directory /opt/app/front-despacho
            cd /opt/app/front-despacho
            git fetch origin
            git checkout deploy
            git reset --hard origin/deploy
            docker compose down
            docker compose pull
            docker compose up -d --force-recreate
            docker image prune -f